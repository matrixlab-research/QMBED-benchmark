name: private-verification

on:
  workflow_dispatch:
    inputs:
      candidate_repository:
        description: GitHub repository containing the Julia candidate
        required: true
        default: matrixlab-research/QuSpin.jl
      candidate_ref:
        description: Candidate branch, tag, or commit SHA
        required: true
        default: main
      benchmark_tier:
        description: Add paper-scale end-to-end workflows to the default small suite
        required: true
        default: small
        type: choice
        options:
          - small
          - paper

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate the full API migration denominator
        run: python ci/check_full_api_plan.py
      - name: Install the pinned Python QuSpin oracle
        run: >-
          python -m pip install
          "git+https://github.com/QuSpin/QuSpin.git@5bf9e5b266e6d8b70e5cf5973c7c7d59d62e412f"
      - name: Reproduce frozen observations
        run: |
          python oracle/generate_reference.py --output /tmp/reference.json
          python ci/compare_reference.py oracle/reference.json /tmp/reference.json

  candidate:
    needs: oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Run held-out Julia verification
        env:
          A_REPO_URL: https://github.com/${{ inputs.candidate_repository }}.git
          A_REF: ${{ inputs.candidate_ref }}
          QUSPIN_TEST_TIMING_OUTPUT: ${{ github.workspace }}/artifacts/test-timings.csv
        run: julia --startup-file=no ci/runcandidate.jl
      - name: Render detailed verification timing
        if: always()
        run: >-
          python3 ci/render_timing_report.py tests
          artifacts/test-timings.csv
          --output artifacts/test-timing-report.md
          >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verification timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-timing-${{ github.run_id }}
          path: |
            artifacts/test-timings.csv
            artifacts/test-timing-report.md
          if-no-files-found: warn

  performance:
    needs: candidate
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Install the pinned Python QuSpin baseline
        run: >-
          python -m pip install
          "git+https://github.com/QuSpin/QuSpin.git@5bf9e5b266e6d8b70e5cf5973c7c7d59d62e412f"
      - name: Install and precompile the Julia candidate
        env:
          A_REPO_URL: https://github.com/${{ inputs.candidate_repository }}.git
          A_REF: ${{ inputs.candidate_ref }}
        run: julia --startup-file=no ci/installcandidate.jl
      - name: Verify Python and Julia operator-archive interchange
        run: python ci/check_archive_interop.py --project .
      - name: Measure the Python QuSpin baseline
        run: >-
          python benchmark/python_benchmarks.py
          --output artifacts/python-benchmarks.csv
      - name: Measure the Julia candidate
        run: >-
          julia --startup-file=no --project=.
          benchmark/julia_benchmarks.jl
          --output artifacts/julia-benchmarks.csv
      - name: Measure small end-to-end Julia ED workflows
        run: >-
          julia --startup-file=no --project=.
          benchmark/julia_ed_workflow_benchmarks.jl
          --output artifacts/julia-ed-workflow-benchmarks.csv
      - name: Measure paper-scale Python QuSpin workflows
        if: inputs.benchmark_tier == 'paper'
        run: >-
          python benchmark/python_paper_workflow_benchmarks.py
          --output artifacts/python-paper-workflow-benchmarks.csv
      - name: Measure paper-scale Julia workflows
        if: inputs.benchmark_tier == 'paper'
        run: >-
          julia --startup-file=no --project=.
          benchmark/julia_paper_workflow_benchmarks.jl
          --output artifacts/julia-paper-workflow-benchmarks.csv
      - name: Measure fresh-process package load
        run: >-
          python benchmark/startup_benchmarks.py
          --project .
          --output artifacts/startup-benchmarks.csv
      - name: Render Python/Julia timing comparison
        run: >-
          python ci/render_timing_report.py benchmarks
          artifacts/python-benchmarks.csv
          artifacts/julia-benchmarks.csv
          artifacts/julia-ed-workflow-benchmarks.csv
          artifacts/startup-benchmarks.csv
          --output artifacts/performance-report.md
          >> "$GITHUB_STEP_SUMMARY"
      - name: Render paper-scale workflow comparison
        if: inputs.benchmark_tier == 'paper'
        run: >-
          python ci/render_timing_report.py benchmarks
          artifacts/python-paper-workflow-benchmarks.csv
          artifacts/julia-paper-workflow-benchmarks.csv
          --output artifacts/paper-performance-report.md
          >> "$GITHUB_STEP_SUMMARY"
      - name: Upload performance baseline and candidate timing
        uses: actions/upload-artifact@v4
        with:
          name: quspin-performance-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
