name: rust-qmbed-benchmarks

on:
  pull_request:
    paths:
      - "rust/**"
      - "docs/RUST_API_CONTRACT.md"
      - "ci/freeze_rust_spec.py"
      - ".github/workflows/rust-contract.yml"
  push:
    branches:
      - main
    paths:
      - "rust/**"
      - "docs/RUST_API_CONTRACT.md"
      - "ci/freeze_rust_spec.py"
      - ".github/workflows/rust-contract.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check the frozen Rust API denominator
        run: python ci/check_rust_api_plan.py
      - name: Check the content-addressed Rust SpecBundle
        run: python ci/freeze_rust_spec.py --check
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Lint the verification harness
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Test API, workflow, invariant, and CSV contracts
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Execute all twelve paper workflows
        run: cargo test --release --manifest-path rust/Cargo.toml --test candidate_workflows -- --ignored --nocapture
