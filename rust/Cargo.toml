[package]
name = "qmbed-benchmark"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
num-bigint = "0.4"
qmbed = { git = "https://github.com/matrixlab-research/QMBED.git", rev = "c7a8a3c855f1270773982bbe823c789212f2fa50", features = ["chainrules"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
