[package]
name = "quspin-rust-verify"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
nalgebra = "0.33"
num-bigint = "0.4"
quspin = { git = "https://github.com/matrixlab-research/QuSpin.rs.git", rev = "b87e0e7a5bb318307baa09586b374b3f516e0e29" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
